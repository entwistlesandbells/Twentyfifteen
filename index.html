<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twentyfifteen</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;1,200;1,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #fff; font-family: 'Spectral', Georgia, serif; color: #111; }

.page {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 24px 32px;
  background: #fff;
  min-height: 100vh;
}

.hero img {
  width: 100%;
  max-width: 440px;
  height: auto;
  display: block;
}

.controls {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  margin-top: 16px;
}

.btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0;
}

.btn-label { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }

.btn-title {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.78rem;
  font-style: italic;
  font-weight: 200;
  letter-spacing: 0.06em;
  color: #111;
}

.btn-sub {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.62rem;
  font-weight: 200;
  letter-spacing: 0.04em;
  color: #aaa;
}

.btn svg { width: 16px; height: 16px; stroke: #111; fill: none; stroke-width: 1; flex-shrink: 0; }
.btn:hover .btn-title { color: #aaa; }
.btn:hover svg { stroke: #aaa; }

.divider { width: 20px; height: 1px; background: #e0e0e0; align-self: flex-end; }

.email-line {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.56rem;
  font-weight: 200;
  font-style: italic;
  letter-spacing: 0.04em;
  color: #777;
  text-decoration: none;
  margin-top: 2px;
}
.email-line:hover { color: #111; }

/* OVERLAY — fully opaque white, no bleed */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.overlay.open { display: flex; }

/* Smaller tighter popup */
.popup {
  background: #fff;
  border: 1px solid #e8e8e8;
  width: 100%;
  max-width: 280px;
  padding: 28px 22px 24px;
  position: relative;
  animation: up 0.2s ease forwards;
}
@keyframes up { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.close {
  position: absolute;
  top: 10px; right: 12px;
  background: none; border: none;
  cursor: pointer;
  font-size: 0.9rem;
  color: #ccc;
  line-height: 1;
}
.close:hover { color: #111; }

.popup-label {
  font-size: 0.52rem;
  font-weight: 200;
  letter-spacing: 0.18em;
  color: #ccc;
  margin-bottom: 5px;
  text-transform: uppercase;
}

.popup-title {
  font-size: 0.95rem;
  font-style: italic;
  font-weight: 200;
  color: #111;
  margin-bottom: 18px;
  line-height: 1.5;
}

.field { margin-bottom: 12px; }
.field input, .field textarea {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #ebebeb;
  padding: 8px 0;
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.85rem;
  font-weight: 200;
  color: #111;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 0;
}
.field input::placeholder, .field textarea::placeholder { color: #ccc; font-style: italic; }
.field input:focus, .field textarea:focus { border-bottom-color: #111; }
.field textarea { resize: none; height: 46px; line-height: 1.6; }

.send {
  margin-top: 16px;
  width: 100%;
  background: #111;
  color: #fff;
  border: none;
  padding: 11px 0;
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.62rem;
  font-weight: 200;
  font-style: italic;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.2s;
}
.send:hover { background: #444; }

.success {
  display: none;
  font-style: italic;
  font-weight: 200;
  color: #aaa;
  font-size: 0.9rem;
  line-height: 2;
  padding: 6px 0;
}
</style>
</head>

<script>
function openPopup(type) {
  var config = {
    commission: { label: 'Commission', title: 'One hide. One skin. Unrepeated.', subject: 'Twentyfifteen - Commission' },
    enquiry:    { label: 'Enquiry',    title: 'Commissions.',                     subject: 'Twentyfifteen - Enquiry' }
  };
  var c = config[type];
  document.getElementById('popup-label').textContent = c.label;
  document.getElementById('popup-title').textContent = c.title;
  document.getElementById('form-subject').value = c.subject;
  document.getElementById('form').style.display = 'block';
  document.getElementById('success').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePopup() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeOnBackdrop(e) {
  if (e.target === document.getElementById('overlay')) closePopup();
}

document.getElementById('form').addEventListener('submit', function() {
  setTimeout(function() {
    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  }, 700);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePopup();
});
</script>
